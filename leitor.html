<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de Slides</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
/* ================= Tokens ================= */
:root {
  --bg: #f4f4f6; --chrome: #ffffff; --side: #fafafb; --text: #16181d; --muted: #525866;
  --border: #e3e1dc; --accent: #e8461e; --accent-soft: #fdeee8; --accent-ink: #b8360f; --inline-bg: #efece6;
  --slide: #ffffff; --card: #f7f7fb; --code-bg: #f3f4f7; --canvas: #e8e9ee;
  --note-bg: #fffaf0; --note-border: #efd28a;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Code", ui-monospace, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #121318; --chrome: #181a20; --side: #15171c; --text: #e8e9ee; --muted: #9aa0ad;
  --border: #2a2d36; --accent: #ff6b45; --accent-soft: #3a2119; --accent-ink: #ffb39c; --inline-bg: #2a2c33;
  --slide: #1c1e25; --card: #23262f; --code-bg: #262934; --canvas: #0e0f13;
  --note-bg: #29251a; --note-border: #6f5d28;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; overflow: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }


/* ================= Barras de rolagem ================= */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
:hover::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--muted) 35%, transparent); }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--muted) 60%, transparent); }
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent; }
}
#nav, #thumbs, #page, #docview { scroll-behavior: smooth; overscroll-behavior: contain; }

/* ================= Sidebar ================= */
aside { width: 300px; min-width: 300px; background: var(--side); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100vh; }
.brand { padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: #fff; flex: none;
  display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: .02em; border: 0; }
.brand h1 { font-size: 13.5px; line-height: 1.25; margin: 0; flex: 1; font-weight: 700; cursor: pointer; }
.icon-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; width: 34px; height: 34px;
  display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.side-search { padding: 0 16px 10px; position: relative; }
.side-search input { width: 100%; padding: 8px 34px 8px 11px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--chrome); color: var(--text); font: inherit; font-size: 13px; }
.side-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.side-search kbd { position: absolute; right: 24px; top: 7px; font: 600 11px var(--mono); color: var(--muted);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; background: var(--side); pointer-events: none; }
.side-search input:focus + kbd, .side-search input:not(:placeholder-shown) + kbd { display: none; }
nav { flex: 1; overflow-y: auto; padding: 2px 10px 16px; font-size: 13.5px; }
.nav-home { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0;
  padding: 7px 10px; border-radius: 7px; font-weight: 600; }
.nav-home:hover { background: var(--accent-soft); }
.nav-home.active { background: var(--accent-soft); color: var(--accent-ink); }
.lvl-label { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  padding: 18px 10px 6px; }
.mod-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 6px; width: 100%; text-align: left; background: none;
  border: 0; padding: 6px 10px; border-radius: 7px; align-items: baseline; line-height: 1.35; }
.mod-row .mnum { font: 700 11px var(--mono); color: var(--muted); }
.mod-row .mp { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod-row:hover { background: var(--accent-soft); }
.mod-row.open { font-weight: 600; }
.mod-row.open .mnum { color: var(--accent); }
.mod-row.active { background: var(--accent-soft); color: var(--accent-ink); }
.les-rows { margin: 2px 0 8px 21px; border-left: 1px solid var(--border); padding-left: 6px; }
.les-row { display: grid; grid-template-columns: 10px 1fr; gap: 9px; align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; padding: 5px 8px; border-radius: 6px; font-size: 13px; line-height: 1.35; }
.les-row:hover { background: var(--accent-soft); }
.st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); opacity: .7; align-self: center; flex: none; }
.started .st { border-color: var(--accent); opacity: 1; }
.done .st { background: var(--accent); border-color: var(--accent); opacity: 1; }
.les-row.active { background: var(--accent); color: #fff; }
.les-row.active .st { border-color: #fff; opacity: 1; }
.les-row.active.done .st { background: #fff; }
details.prof { margin-top: 18px; }
details.prof > summary { cursor: pointer; list-style: none; font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); padding: 6px 10px; border-radius: 6px; }
details.prof > summary::-webkit-details-marker { display: none; }
details.prof > summary::after { content: " +"; }
details.prof[open] > summary::after { content: " \2212"; }
.doc-row { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 10px; border-radius: 6px; font-size: 13px; }
.doc-row:hover { background: var(--accent-soft); }
.doc-row.active { background: var(--accent); color: #fff; }
.empty-nav { color: var(--muted); padding: 12px 10px; }
/* resultados da busca */
.res-count { font-size: 12px; color: var(--muted); padding: 2px 10px 6px; }
.res-group { font-size: 11px; font-weight: 700; color: var(--accent-ink); padding: 14px 10px 4px; line-height: 1.35; }
.res { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 7px; }
.res:hover { background: var(--accent-soft); }
.res b { display: block; font-size: 13px; font-weight: 600; line-height: 1.35; }
.res span { display: block; font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 1px; }
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ================= Main ================= */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--border);
  background: var(--chrome); min-height: 52px; }
.crumbs { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--text); font-weight: 600; }
.crumbs a { color: inherit; text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 8px; opacity: .5; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); user-select: none; cursor: pointer; }
.toggle input { accent-color: var(--accent); }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
#menu { display: none; }
.workspace { flex: 1; display: flex; min-height: 0; }

/* ---------- miniaturas ---------- */
#thumbs { width: 212px; min-width: 212px; overflow-y: auto; background: var(--side); border-right: 1px solid var(--border); padding: 12px 10px 24px; }
.thumb { display: flex; gap: 6px; margin-bottom: 12px; cursor: pointer; }
.thumb .n { width: 18px; text-align: right; font-size: 11px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.thumb .t { width: 168px; height: 94.5px; position: relative; overflow: hidden; border-radius: 4px;
  outline: 1px solid var(--border); background: var(--slide); }
.thumb .t .stage { transform: scale(.13125); }
.thumb:hover .t { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); }
.thumb.active .t { outline: 2.5px solid var(--accent); }
.thumb.active .n { color: var(--accent); font-weight: 700; }

/* ---------- área do slide ---------- */
#center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); }
#viewer { flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px; }
.frame { position: relative; box-shadow: 0 1px 2px #0002, 0 12px 40px #0002; border-radius: 6px; overflow: hidden; background: var(--slide); }
.ctrl { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 0 0 12px; font-size: 13px; color: var(--muted); }
.ctrl button { background: var(--chrome); border: 1px solid var(--border); border-radius: 99px; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.ctrl button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.ctrl button:disabled { opacity: .35; cursor: default; }
.ctrl .next-lesson { width: auto !important; border-radius: 99px; padding: 0 16px; font-size: 13px !important; font-weight: 600;
  background: var(--accent) !important; color: #fff; border-color: var(--accent) !important; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctrl .next-lesson:hover { filter: brightness(1.08); color: #fff !important; }
.ctrl .count { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
#notespane { border-top: 1px solid var(--border); background: var(--chrome); padding: 10px 24px 12px; max-height: 24vh; overflow-y: auto;
  font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
#notespane .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; white-space: normal; }
#notespane.empty { color: var(--muted); font-style: italic; padding-top: 6px; padding-bottom: 6px; font-size: 12.5px; }
#notespane.empty .lbl { display: inline; margin-right: 8px; }
.hide-notes #notespane { display: none; }

/* ---------- modo documento ---------- */
#docview { flex: 1; overflow-y: auto; padding: 40px 24px 80px; background: var(--bg); }
.mode-doc #thumbs, .mode-doc #center { display: none; }
.mode-slides #docview { display: none; }
article.doc { max-width: 820px; margin: 0 auto; font-size: 17px; line-height: 1.7; }
article.doc .unit + .unit { border-top: 1px dashed var(--border); margin-top: 2.4em; padding-top: 1.6em; }
article.doc h1 { font-family: var(--display); font-size: 2.2rem; line-height: 1.2; margin: .2em 0 .6em; letter-spacing: -.02em; }
article.doc h2 { font-size: 1.5rem; margin: 1.6em 0 .5em; }
article.doc h3 { font-size: 1.15rem; margin: 1.3em 0 .4em; }
.note { margin: 1.4em 0 0; padding: 12px 16px; background: var(--note-bg); border: 1px dashed var(--note-border);
  border-radius: 10px; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; }
.note strong { display: block; text-transform: uppercase; font-size: 11px; letter-spacing: .08em; color: var(--muted); white-space: normal; }
.hide-notes .note { display: none; }
.pager { max-width: 820px; margin: 48px auto 0; display: flex; gap: 12px; }
.pager button { flex: 1; text-align: left; background: var(--chrome); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.pager button:hover { border-color: var(--accent); }
.pager .next { text-align: right; }
.pager small { display: block; color: var(--muted); font-size: 12px; }
.pager span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 9px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--chrome); color: var(--muted); opacity: 0; transition: opacity .15s; }
pre:hover .copy { opacity: 1; }
.welcome { max-width: 520px; margin: 16vh auto 0; text-align: center; color: var(--muted); line-height: 1.6; }
.welcome h2 { color: var(--text); font-size: 1.6rem; }


/* ================= Páginas: mapa do curso e módulo ================= */
#page { flex: 1; overflow-y: auto; background: var(--bg); }
body:not([data-view=lesson]) #thumbs, body:not([data-view=lesson]) #center, body:not([data-view=lesson]) #docview { display: none; }
body[data-view=lesson] #page { display: none; }
body:not([data-view=lesson]) .lesson-only { display: none !important; }
.pg { max-width: 1060px; margin: 0 auto; padding: 44px 40px 96px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hero h1, .mod-head h1 { font: 700 38px/1.12 var(--display); letter-spacing: -.02em; margin: 8px 0 12px; }
.hero p, .mod-head p.obj { color: var(--muted); font-size: 16.5px; line-height: 1.6; max-width: 760px; margin: 0; }
.hero p b, .mod-head p b { color: var(--text); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 13.5px; margin: 18px 0 22px; }
.stats b { color: var(--text); font-size: 15px; margin-right: 3px; }
.cta { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: #fff; border: 0; border-radius: 10px;
  padding: 11px 18px; font-weight: 600; font-size: 14px; text-align: left; }
.cta small { display: block; font-weight: 400; opacity: .85; font-size: 12px; }
.cta:hover { filter: brightness(1.08); }
.cta.ghost { background: var(--chrome); color: var(--text); border: 1px solid var(--border); }
.cta.ghost:hover { border-color: var(--accent); filter: none; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.level { margin-top: 46px; }
.level-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 16px; }
.level-head .lvl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink);
  background: var(--accent-soft); border-radius: 99px; padding: 3px 10px; }
.level-head h2 { font-size: 20px; margin: 0; }
.level-head p { color: var(--muted); margin: 0; font-size: 14px; }
.mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.mod-card { text-align: left; background: var(--chrome); border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 14px;
  display: flex; flex-direction: column; gap: 6px; min-height: 160px; transition: border-color .15s, transform .15s, box-shadow .15s; }
.mod-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px #0000000f; }
.mod-card .mnum { font: 800 12px var(--mono); color: var(--accent); letter-spacing: .04em; }
.mod-card h3 { margin: 0; font-size: 16px; line-height: 1.3; }
.mod-card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; flex: 1; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.meter { flex: 1; max-width: 90px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.back { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 0; margin-bottom: 22px; }
.back:hover { color: var(--accent); }
.mod-head .q { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
.les-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; background: var(--chrome); overflow: hidden; margin-top: 28px; }
.les { display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: center; padding: 15px 18px; text-align: left;
  border: 0; background: none; border-bottom: 1px solid var(--border); }
.les:last-child { border-bottom: 0; }
.les:hover { background: var(--accent-soft); }
.les .ln { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--mono);
  border: 1.5px solid var(--border); color: var(--muted); }
.les.started .ln { border-color: var(--accent); color: var(--accent); }
.les.done .ln { background: var(--accent); border-color: var(--accent); color: #fff; }
.les h3 { margin: 0; font-size: 16px; }
.les p { margin: 3px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.les .cnt { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
.les .cnt b { display: block; color: var(--accent-ink); font-weight: 600; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
.info { background: var(--chrome); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 14.5px; line-height: 1.6; }
.info h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.info > div > :first-child { margin-top: 0; } .info > div > :last-child { margin-bottom: 0; }
details.why { margin-top: 16px; background: var(--chrome); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; font-size: 14.5px; line-height: 1.6; }
details.why > summary { cursor: pointer; font-weight: 600; }
.mod-pager { display: flex; gap: 12px; margin-top: 32px; }
.mod-pager button { flex: 1; text-align: left; background: var(--chrome); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.mod-pager button:hover { border-color: var(--accent); }
.mod-pager .next { text-align: right; }
.mod-pager small { display: block; color: var(--muted); font-size: 12px; }
.prof-links { margin-top: 46px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.prof-links button { background: none; border: 0; color: var(--muted); padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.prof-links button:hover { color: var(--accent); }

/* ================= Conteúdo Markdown (comum a slide e documento) ================= */
.md a { color: var(--accent); text-underline-offset: 3px; }
.md img { max-width: 100%; border-radius: 8px; }
.md strong { font-weight: 700; }
.md p { margin: .45em 0; }
.md p.lead { font-weight: 700; margin-bottom: .25em; }
.md ul, .md ol { margin: .35em 0; }
.md ul { padding-left: 1.1em; }
.md ul > li::marker { color: var(--accent); }
.md li { margin: .2em 0; padding-left: .1em; }
.md ol { list-style: none; padding-left: 0; counter-reset: n; }
.md ol > li { counter-increment: n; position: relative; padding-left: 1.8em; margin: .35em 0; }
.md ol > li::before { content: counter(n); position: absolute; left: 0; top: .2em; width: 1.3em; height: 1.3em; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: .78em; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.md code { font-family: var(--mono); font-size: .84em; background: var(--inline-bg); padding: .08em .35em; border-radius: 5px; font-weight: 600; }
.md .term { margin: .65em 0; border-radius: 12px; background: #1d1f24; overflow: hidden; position: relative; }
.md .term-bar { display: flex; align-items: center; gap: .45em; padding: .7em 1em .1em; font: 600 15px var(--mono); color: #8b8f99; }
.md .term-bar i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; }
.md .term-bar i:nth-child(2) { background: #ffbd2e; } .md .term-bar i:nth-child(3) { background: #27c93f; margin-right: .5em; }
.md pre { position: relative; margin: 0; }
.md pre code, .md pre code.hljs { display: block; padding: .45em 1.1em .8em; overflow-x: auto; background: transparent; color: #e6e6e6;
  font-size: .72em; line-height: 1.55; border-radius: 0; font-weight: 400; }
.md blockquote { margin: .6em 0; padding: .45em .9em; background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 10px; }
.md blockquote > :first-child { margin-top: 0; } .md blockquote > :last-child { margin-bottom: 0; }
.md .table-wrap { overflow-x: auto; margin: .6em 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: .1em .8em; }
.md table { border-collapse: collapse; width: 100%; font-size: .82em; }
.md th, .md td { padding: .45em .6em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
.md tr:last-child td { border-bottom: 0; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<script>
const $ = s => document.querySelector(s);
const collator = new Intl.Collator('pt-BR', { numeric: true, sensitivity: 'base' });
const SKIP = /(^|\/)(node_modules|\.git|\.claude)(\/|$)/;
const W = 1280, H = 720;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let files = new Map();   // caminho -> File
let docs = [];           // {path, title, text, units[]}
let units = [];          // slides em ordem global: {doc, i, md, notes, layout, lesson?}
let cur = -1;            // índice em units
let view = 'home';       // home | module | lesson
let mode = store.get('mode') === 'doc' ? 'doc' : 'slides';
let modules = [], lessons = [], levels = [], profDocs = [], searchIdx = [];
const decks = new Map(); // chave -> lista de units (aula inteira ou documento solto)
const urls = new Map();
const prog = (() => { try { return JSON.parse(store.get('prog') || '{}'); } catch { return {}; } })();
const saveProg = () => store.set('prog', JSON.stringify(prog));
const dirOf = p => p.split('/').slice(0, -1).join('/');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
const norm = s => s.split('').map(c => c.normalize('NFD')[0]).join('').toLowerCase();
const h = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'onclick') e.onclick = v; else e.setAttribute(k, v); } e.innerHTML = html; return e; };

/* ---------- tema, modo, notas ---------- */
function setTheme(t) { document.documentElement.dataset.theme = t; store.set('theme', t); }
setTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#notes').checked = store.get('notes') === '1';
document.body.classList.toggle('hide-notes', !$('#notes').checked);
$('#notes').onchange = e => { document.body.classList.toggle('hide-notes', !e.target.checked); store.set('notes', e.target.checked ? '1' : '0'); if (mode === 'slides') scaleAll(); };
$('#menu').onclick = () => document.body.classList.toggle('menu-open');
$('#homeLogo').onclick = $('#brandTitle').onclick = () => go('#/');
function setMode(m) {
  mode = m; store.set('mode', m);
  document.body.classList.toggle('mode-doc', m === 'doc'); document.body.classList.toggle('mode-slides', m === 'slides');
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#thumbs').dataset.deck = ''; if (cur >= 0 && view === 'lesson') show(cur);
}
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
setMode(mode);
function setView(v) { view = v; document.body.dataset.view = v; document.body.classList.remove('menu-open'); }
setView('home');

/* ---------- carregar arquivos ---------- */
addEventListener('DOMContentLoaded', () => {
  if (!window.CONTEUDO) { $('#page').innerHTML = '<div class="welcome"><h2>Conteúdo não encontrado</h2><p>Gere o <code>conteudo.js</code> com <code>gerar-conteudo.ps1</code>.</p></div>'; return; }
  const map = new Map();
  for (const [p, t] of Object.entries(window.CONTEUDO)) map.set(p, new File([t], p.split('/').pop()));
  load(map);
});
/* Divide um .md em slides: linha "---" (fora de bloco de código) separa slides.
   Arquivos longos sem "---" são divididos automaticamente em cada "## ". */
function splitUnits(text) {
  const lines = text.split(/\r?\n/);
  const cut = (test, src = lines) => { let fence = false; const out = [[]];
    for (const l of src) {
      if (/^\s*(```|~~~)/.test(l)) fence = !fence;
      const r = !fence && test(l);
      if (r === 'drop') { out.push([]); continue; }
      if (r === 'keep' && out.at(-1).some(x => x.trim())) out.push([]);
      out.at(-1).push(l);
    }
    return out.map(c => c.join('\n')).filter(c => c.replace(/<!--[\s\S]*?-->/g, '').trim());
  };
  const parts = cut(l => /^\s*---\s*$/.test(l) ? 'drop' : null).flatMap(p => {
    const ls = p.split('\n');
    const long = ls.filter(l => l.trim() && !/^\s*<!--/.test(l)).length > 30;
    return long && ls.filter(l => /^##\s/.test(l)).length >= 2 ? cut(l => /^##\s/.test(l) ? 'keep' : null, ls) : [p];
  });
  return parts.length ? parts : [text];
}

async function load(map) {
  files = map; urls.forEach(u => URL.revokeObjectURL(u)); urls.clear();
  const mds = [...map.keys()].filter(p => /\.md$/i.test(p));
  docs = await Promise.all(mds.map(async p => {
    const text = await map.get(p).text();
    const m = text.replace(/<!--[\s\S]*?-->/g, '').match(/^\s*#\s+(.+)$/m);
    return { path: p, title: m ? m[1].trim() : p.split('/').pop().replace(/\.md$/i, ''), text };
  }));
  docs.sort((a, b) => cmpPath(a.path, b.path));
  units = [];
  docs.forEach(d => {
    d.units = splitUnits(d.text).map((md, i) => {
      const notes = []; let layout = '';
      const body = md.replace(/<!--([\s\S]*?)-->/g, (_, t) => { t = t.trim(); const m = t.match(/^layout:\s*(\w+)$/i); if (m) layout = m[1].toLowerCase(); else notes.push(t); return ''; });
      return { doc: d, i, md: body, notes, layout };
    });
    d.start = units.length; units.push(...d.units);
  });
  buildCourse();
  buildIndex();
  $('#thumbs').dataset.deck = ''; cur = -1;
  $('#q').value = '';
  if (!docs.length) { $('#page').innerHTML = '<div class="welcome"><h2>Nenhum .md encontrado</h2></div>'; return; }
  route();
}
function cmpPath(a, b) {
  const A = a.split('/'), B = b.split('/');
  for (let i = 0; i < Math.min(A.length, B.length); i++) {
    if (A[i] === B[i]) continue;
    const aDir = i < A.length - 1, bDir = i < B.length - 1;
    if (aDir !== bDir) return aDir ? 1 : -1;
    return collator.compare(A[i], B[i]);
  }
  return A.length - B.length;
}

/* ---------- modelo do curso: níveis (EAP.md) → módulos (README) → aulas (pastas) ---------- */
function buildCourse() {
  decks.clear(); modules = []; lessons = []; levels = []; profDocs = [];
  const find = re => docs.find(d => re.test(d.path));
  const readme = find(/^readme\.md$/i), eap = find(/^eap\.md$/i), jornada = find(/^jornada\.md$/i);
  // problema que cada módulo resolve (tabelas da JORNADA)
  const probs = {};
  (jornada?.text || '').split(/\r?\n/).forEach(l => {
    const m = l.match(/^\|\s*(\d{1,2})\s+[^|]*\|([^|]*)\|([^|]*)\|([^|]*)\|/);
    if (m) probs[m[1].padStart(2, '0')] = { prob: m[2].trim(), sem: m[3].trim(), ganho: m[4].trim() };
  });
  const modDirs = [...new Set(docs.map(d => d.path.split('/')).filter(p => p.length > 1 && /^m[óo]dulo/i.test(p[0])).map(p => p[0]))].sort(collator.compare);
  modules = modDirs.map(dir => {
    const num = ((dir.match(/\d+/) || ['0'])[0]).padStart(2, '0');
    const rd = docs.find(d => d.path.toLowerCase() === (dir + '/readme.md').toLowerCase());
    const title = rd ? rd.title.replace(/^M[óo]dulo\s+\d+\s*[:·]\s*/i, '') : dir.replace(/^M[óo]dulo-\d+-?/i, '').replace(/-/g, ' ');
    const qs = {}, names = {};
    (rd?.text || '').split(/\r?\n/).forEach(l => {
      const m = l.match(/^\|\s*\[(\d+)\s+([^\]]+)\]\(\.?\/?([^)]+?)\/?\)\s*\|\s*([^|]+)\|/);
      if (m) { qs[m[3]] = m[4].trim(); names[m[3]] = m[2].trim(); }
    });
    const mod = { dir, num, title, readme: rd, objetivo: ((rd?.text || '').match(/^Objetivo:\s*(.+)$/m) || [])[1] || '', ...(probs[num] || {}), lessons: [] };
    if (rd) rd.module = mod;
    const lessonDirs = [...new Set(docs.map(d => d.path.split('/')).filter(p => p.length === 3 && p[0] === dir).map(p => p[1]))].sort(collator.compare);
    mod.lessons = lessonDirs.map(ld => {
      const ds = docs.filter(d => dirOf(d.path) === dir + '/' + ld);
      const l = { mod, dir: dir + '/' + ld, num: ((ld.match(/\d+/) || ['0'])[0]).padStart(2, '0'),
        title: names[ld] || (ds[0]?.title || '').replace(/^Aula\s+\d+\s*[:·]\s*/i, '') || ld.replace(/^Aula-\d+-?/i, '').replace(/-/g, ' '),
        q: qs[ld] || '', units: ds.flatMap(d => d.units) };
      l.units.forEach(u => u.lesson = l);
      l.start = units.indexOf(l.units[0]);
      decks.set(l.dir, l.units);
      return l;
    });
    lessons.push(...mod.lessons);
    return mod;
  });
  // demais documentos: cada um é seu próprio deck
  docs.forEach(d => { if (!d.units[0]?.lesson) decks.set(d.path, d.units); });
  profDocs = docs.filter(d => !d.path.includes('/'));
  // níveis a partir da árvore do EAP
  const tree = ((eap?.text || '').split(/^##\s+Árvore/m)[1] || '').split(/^##\s/m)[0];
  let L = null;
  tree.split(/\r?\n/).forEach(raw => {
    const l = raw.replace(/^[\s│├└─]+/, '').trim();
    const md = l.match(/^(M[óo]dulo-[\w-]+)/i);
    if (md) { const mod = modules.find(x => x.dir === md[1]); if (mod && L && !mod.level) { mod.level = L; L.mods.push(mod); } return; }
    const g = l.match(/^(N[íi]vel\s+\d+|Anexo)\s*·\s*([^:(]+?)\s*(?::\s*([^(]+?))?\s*(?:\((.+)\))?\s*$/);
    if (g) { L = { name: g[1], title: g[2], sub: g[3] || '', note: g[4] || '', mods: [] }; levels.push(L); }
  });
  const rest = modules.filter(m => !m.level);
  if (rest.length) { const R = { name: levels.length ? 'Outros' : 'Curso', title: levels.length ? 'Outros módulos' : 'Módulos', sub: '', note: '', mods: rest }; rest.forEach(m => m.level = R); levels.push(R); }
  // título e descrição do curso
  const course = readme?.title || 'Curso';
  const desc = ((readme?.text || '').replace(/^\s*#.*$/m, '').trim().split(/\r?\n\s*\r?\n/)[0] || '').trim();
  window.COURSE = { title: course, desc };
  $('#brandTitle').textContent = course;
}
const lessonStatus = l => { const p = prog[l.dir] || 0; return p >= l.units.length ? 'done' : p > 0 ? 'started' : ''; };
const modDone = m => m.lessons.filter(l => lessonStatus(l) === 'done').length;
const deckKey = u => u.lesson ? u.lesson.dir : u.doc.path;
const deckOf = u => decks.get(deckKey(u)) || [u];
const sectionOf = u => deckOf(u)[0].doc.title;
const lessonLabel = l => `Módulo ${l.mod.num} · Aula ${l.num}`;

/* ---------- rotas: #/  ·  #/m/<módulo>  ·  #/s/<aula ou arquivo>/<slide> ---------- */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  if (!docs.length) return;
  const hs = decodeURI(location.hash.slice(1) || '/');

}

  const MAX = 120;
  nav.appendChild(h('div', { class: 'res-count' }, hits.length > MAX ? `${hits.length} slides, mostrando ${MAX}` : `${hits.length} slide${hits.length > 1 ? 's' : ''}`));
  let lastKey = null;
  hits.slice(0, MAX).forEach(e => {
    const u = e.u, k = deckKey(u);
    if (k !== lastKey) {
      lastKey = k;
      const lbl = u.lesson ? `${u.lesson.mod.num}.${u.lesson.num} · ${u.lesson.title}` : u.doc.module ? `Módulo ${u.doc.module.num} · Visão geral` : `Professor · ${u.doc.title}`;
      nav.appendChild(h('div', { class: 'res-group' }, esc(lbl)));

    const a = Math.max(0, i - 40), b = Math.min(e.text.length, i + 90);

    nav.appendChild(h('button', { class: 'res', onclick: () => { show(units.indexOf(u)); } },

    }
    if (!p.className && p.parentElement === el && /:\s*$/.test(txt) && txt.length < 90) p.className = 'lead';

    [...g.children].forEach(c => { const hh = c.querySelector('h3'); const m = hh && hh.textContent.match(/^(\d+)[.)\-]?\s+(.+)$/);
      if (m) hh.innerHTML = `<span class="num">${m[1].padStart(2, '0')}</span>${esc(m[2])}`; });
    g.style.setProperty('--cols', k <= 3 ? k : k === 4 ? (g.textContent.length < 260 ? 4 : 2) : 3);

    const k = resolve(path, src), f = files.get(k);

  });

  const LANG = { ts: 'typescript', typescript: 'typescript', js: 'javascript', javascript: 'javascript', bash: 'terminal', sh: 'terminal',
    shell: 'terminal', console: 'terminal', json: 'json', md: 'markdown', markdown: 'markdown', py: 'python', python: 'python',
    html: 'html', css: 'css', sql: 'sql', yaml: 'yaml', yml: 'yaml' };

    if (dest) a.onclick = e => { e.preventDefault(); if (pres) { const k = deck.indexOf(units[dest.start]); if (k >= 0) return showSlide(k); stopPresentation(); } show(dest.start); };
    else a.style.opacity = .6;

  while (sb.scrollHeight > sb.clientHeight + 1 && size > 24) sb.style.fontSize = --size + 'px';
  st.classList.toggle('scroll', sb.scrollHeight > sb.clientHeight + 1);
  st.querySelectorAll('img').forEach(i => { if (!i.complete) i.addEventListener('load', () => fit(st), { once: true }); });
}
function place(container, st) {
  const fr = document.createElement('div'); fr.className = 'frame'; fr.appendChild(st);
  container.replaceChildren(fr); fit(st); scale(container); return fr;
}
function scale(container) {
  const fr = container.querySelector('.frame'); if (!fr) return;
  const cs = getComputedStyle(container);
  const w = container.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const hh = container.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(.1, Math.min(w / W, hh / H));
  fr.style.width = W * s + 'px'; fr.style.height = H * s + 'px';
  fr.firstChild.style.transform = `scale(${s})`;
}
function scaleAll() { scale($('#viewer')); if (pres) scale($('#pview')); }
new ResizeObserver(() => scale($('#viewer'))).observe($('#viewer'));
new ResizeObserver(() => pres && scale($('#pview'))).observe($('#pview'));

/* ---------- exibir uma aula (ou documento) ---------- */
const lessonAt = d => l => lessons[lessons.indexOf(l) + d];
function show(idx) {
  if (!units.length) return;
  cur = Math.min(Math.max(idx, 0), units.length - 1);
  const u = units[cur];
  if (u.doc.module) return showModule(u.doc.module);   // README do módulo abre a página do módulo
  setView('lesson');
  const dk = deckOf(u), pos = dk.indexOf(u), l = u.lesson;
  const hs = '#/s/' + encodeURI(deckKey(u)) + '/' + (pos + 1);
  setHash(hs); store.set('last', hs);
  if (l) { prog[l.dir] = Math.max(prog[l.dir] || 0, pos + 1); saveProg(); }
  setCrumbs(l ? [['Mapa do curso', '#/'], [`Módulo ${l.mod.num} · ${l.mod.title}`, '#/m/' + encodeURI(l.mod.dir)], [`Aula ${l.num}: ${l.title}`]]
    : [['Mapa do curso', '#/'], ['Material do professor', '#/'], [u.doc.title]]);
  document.title = (l ? `${l.num} ${l.title}` : u.doc.title) + ' | ' + COURSE.title;
  buildNav();
  mode === 'slides' ? showSlides(u) : showDoc(u);
}
function step(d) {
  const u = units[cur], dk = deckOf(u), pos = dk.indexOf(u), l = u.lesson;
  if (mode === 'doc') { const o = l && lessonAt(d)(l); if (o) show(o.start); return; }
  if (dk[pos + d]) return show(units.indexOf(dk[pos + d]));
  const o = l && lessonAt(d)(l); if (!o) return;
  show(d > 0 ? o.start : units.indexOf(o.units.at(-1)));
}
function showSlides(u) {
  const dk = deckOf(u), pos = dk.indexOf(u), l = u.lesson, nl = l && lessonAt(1)(l), pl = l && lessonAt(-1)(l);
  place($('#viewer'), buildStage(u, pos + 1, dk.length, { section: sectionOf(u) }));
  $('#ctrl').hidden = false;
  $('#count').textContent = `${pos + 1} / ${dk.length}`;
  const last = pos === dk.length - 1;
  $('#prev').disabled = pos === 0 && !pl; $('#next').disabled = last && !nl;
  $('#next').hidden = last && !!nl;
  const nb = $('#nextLesson'); nb.hidden = !(last && nl);
  if (last && nl) { nb.textContent = `Próxima aula: ${nl.title} →`; nb.title = lessonLabel(nl); nb.onclick = () => show(nl.start); }
  const np = $('#notespane'); np.hidden = false;
  np.classList.toggle('empty', !u.notes.length);
  np.innerHTML = '<span class="lbl">Notas do professor</span>';
  np.append(u.notes.join('\n\n') || 'Sem notas neste slide.');
  buildThumbs(u, dk);
  scale($('#viewer'));
}
function buildThumbs(u, dk) {
  const box = $('#thumbs'), key = deckKey(u) + '|' + dk.length;
  if (box.dataset.deck !== key) {
    box.dataset.deck = key; box.innerHTML = '';
    dk.forEach((x, i) => {
      const el = document.createElement('div'); el.className = 'thumb'; el._u = x;
      el.innerHTML = `<span class="n">${i + 1}</span><div class="t"></div>`;
      const st = buildStage(x, i + 1, dk.length, { interactive: false, highlight: false, section: sectionOf(x) });
      el.querySelector('.t').appendChild(st);
      el.onclick = () => show(units.indexOf(x));
      box.appendChild(el); fit(st);
    });
  }
  box.querySelectorAll('.thumb').forEach(t => t.classList.toggle('active', t._u === u));
  box.querySelector('.thumb.active')?.scrollIntoView({ block: 'nearest' });
}
/* Modo leitura: a aula inteira como um texto corrido. */
function showDoc(u) {
  const art = $('#doc'), dk = deckOf(u), l = u.lesson; art.innerHTML = '';
  if (l) art.appendChild(h('div', { class: 'eyebrow' }, esc(lessonLabel(l))));
  dk.forEach(x => {
    const w = document.createElement('section'); w.className = 'unit';
    w.append(...renderMd(x.md, x.doc.path).childNodes);
    w.querySelectorAll('pre > code').forEach(c => {
      const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Copiar';
      b.onclick = async () => { await navigator.clipboard.writeText(c.innerText); b.textContent = 'Copiado ✓'; setTimeout(() => b.textContent = 'Copiar', 1400); };
      c.parentElement.appendChild(b);
    });
    if (x.notes.length) { const n = document.createElement('div'); n.className = 'note'; n.innerHTML = '<strong>Notas do professor</strong>'; n.append(x.notes.join('\n\n')); w.appendChild(n); }
    art.appendChild(w); x._el = w;
  });
  if (l) {
    prog[l.dir] = l.units.length; saveProg();
    const pager = document.createElement('div'); pager.className = 'pager';
    const mk = (o, cls, lbl) => { const b = document.createElement('button'); b.className = cls;
      b.innerHTML = `<small>${lbl}</small><span>${esc(lessonLabel(o))}: ${esc(o.title)}</span>`; b.onclick = () => show(o.start); return b; };
    const p = lessonAt(-1)(l), n = lessonAt(1)(l);
    pager.appendChild(p ? mk(p, 'prev', '← Aula anterior') : document.createElement('span'));
    if (n) pager.appendChild(mk(n, 'next', 'Próxima aula →'));
    art.appendChild(pager);
  }
  if (dk.indexOf(u) > 0) u._el.scrollIntoView(); else $('#docview').scrollTo(0, 0);
}
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);

/* ---------- apresentação ---------- */
let pres = false, deck = [], si = 0;
function startPresentation() {
  if (!units.length || view !== 'lesson') return;
  const u = units[Math.max(cur, 0)];
  deck = deckOf(u); si = Math.max(0, deck.indexOf(u));
  pres = true; $('#pres').hidden = false;
  try { $('#pres').requestFullscreen?.().catch(() => {}); } catch {}
  showSlide(si);
}
function showSlide(i) {
  si = Math.min(Math.max(i, 0), deck.length - 1);
  const u = deck[si];
  place($('#pview'), buildStage(u, si + 1, deck.length, { section: sectionOf(u) }));
  $('#pnotes-body').textContent = u.notes.join('\n\n') || '(sem notas neste slide)';
  $('#pcount').textContent = `${si + 1} / ${deck.length}`;
  $('#ptitle').textContent = u.lesson ? `${lessonLabel(u.lesson)}: ${u.lesson.title}` : sectionOf(u);
  $('#pbar').style.width = ((si + 1) / deck.length * 100) + '%';
  cur = units.indexOf(u);
  if (u.lesson) { prog[u.lesson.dir] = Math.max(prog[u.lesson.dir] || 0, si + 1); saveProg(); }
}
function stopPresentation() {
  pres = false; $('#pres').hidden = true;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  show(cur);
}
$('#present').onclick = startPresentation;
$('#pprev').onclick = () => showSlide(si - 1);
$('#pnext').onclick = () => showSlide(si + 1);
document.addEventListener('fullscreenchange', () => requestAnimationFrame(scaleAll));

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = /input|textarea/i.test(document.activeElement.tagName);
  const k = e.key;
  if (pres) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); showSlide(si + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); showSlide(si - 1); }
    else if (k === 'Home') showSlide(0);
    else if (k === 'End') showSlide(deck.length - 1);
    else if (k === 'n' || k === 'N') { $('#pres').classList.toggle('show-notes'); requestAnimationFrame(scaleAll); }
    else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : $('#pres').requestFullscreen?.(); }
    else if (k === 'Escape' && !document.fullscreenElement) stopPresentation();
    return;
  }
  if (typing) return;
  if (k === '/') { e.preventDefault(); return $('#q').focus(); }
  if (view !== 'lesson' || cur < 0) return;
  if (k === 'F5' || k === 'p' || k === 'P') { e.preventDefault(); return startPresentation(); }
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); step(1); }
  if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); step(-1); }
});
</script>
</body>
</html>
